<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全台堰塞湖清冊 · 空間分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 狀態列 -->
<div class="statusbar">
  <div class="wrap">
    <span class="sysname"><span class="pulse"></span>全台堰塞湖清冊</span>
    <div class="stat"><span class="label">總計</span><b data-bind="countAll">—</b></div>
    <div class="stat"><span class="label">監測中</span><b data-bind="countWatch">—</b></div>
    <div class="stat"><span class="label">存在已穩定</span><b data-bind="countStable">—</b></div>
    <div class="stat"><span class="label">已消失</span><b data-bind="countGone">—</b></div>
    <span class="spacer"></span>
    <div class="stat"><span class="label">資料來源</span><b>農村水保署清冊</b></div>
  </div>
</div>

<main class="wrap">

  <!-- 主視圖 -->
  <section class="board">

    <div class="panel map-panel">
      <div class="panel-head">
        <h2>全台分布</h2>
        <span class="head-note" data-bind="mapCount">—</span>
      </div>

      <div class="map-stage">
        <svg id="map" viewBox="0 0 460 780" role="img"
             aria-label="台灣平面圖，標示歷年堰塞湖位置">
          <defs>
            <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
              <path d="M46 0 L0 0 0 46" fill="none" stroke="rgba(202,216,206,.07)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect x="0" y="0" width="460" height="780" fill="url(#grid)"/>
          <g id="mapBase"></g>
          <g id="mapMarkers"></g>
        </svg>

        <div class="map-legend">
          <span><i class="key k-watch"></i>監測中</span>
          <span><i class="key k-stable"></i>存在已穩定</span>
          <span><i class="key k-gone"></i>已消失</span>
          <span class="sep"></span>
          <span class="scale"><i class="key sz-s"></i><i class="key sz-m"></i><i class="key sz-l"></i>蓄水量</span>
        </div>
      </div>
    </div>

    <div class="panel detail-panel">
      <div class="detail-head">
        <span class="grade" data-bind="status">—</span>
        <h1 data-bind="name">—</h1>
        <span class="where" data-bind="where">—</span>
      </div>

      <div class="readout">
        <div class="cell">
          <span class="label">蓄水量</span>
          <div><span class="num" data-bind="volume">—</span><span class="unit">萬 m³</span></div>
          <div class="sub" data-bind="volumeNote">—</div>
        </div>
        <div class="cell">
          <span class="label">形成年度</span>
          <div><span class="num" data-bind="year">—</span></div>
          <div class="sub" data-bind="formed">—</div>
        </div>
        <div class="cell">
          <span class="label">持續時間</span>
          <div><span class="num" data-bind="duration">—</span><span class="unit" data-bind="durationUnit"></span></div>
          <div class="sub" data-bind="durationNote">—</div>
        </div>
      </div>

      <dl class="facts" id="facts"></dl>
    </div>
  </section>

  <!-- 年度分布 -->
  <section class="sec">
    <div class="sec-head">
      <h2>年度分布</h2>
      <span class="rule"></span>
      <span class="count">1979 – 2026 · 點選年份篩選</span>
    </div>
    <div class="panel timeline-panel">
      <svg id="timeline" viewBox="0 0 1200 260" role="img"
           aria-label="各年度堰塞湖形成數量長條圖"></svg>
      <p class="map-note" data-bind="timelineNote">—</p>
    </div>
  </section>

  <!-- 篩選與清單 -->
  <section class="sec">
    <div class="sec-head">
      <h2>清冊</h2>
      <span class="rule"></span>
      <span class="count" data-bind="listCount">—</span>
    </div>

    <div class="filterbar">
      <div class="filter-group" role="group" aria-label="依存續狀態篩選">
        <span class="label">存續狀態</span>
        <div class="filters">
          <button class="filter is-on" data-kind="status" data-val="all">全部</button>
          <button class="filter" data-kind="status" data-val="watch">監測中</button>
          <button class="filter" data-kind="status" data-val="stable">已穩定</button>
          <button class="filter" data-kind="status" data-val="gone">已消失</button>
        </div>
      </div>
      <div class="filter-group" role="group" aria-label="依誘因篩選">
        <span class="label">誘因</span>
        <div class="filters">
          <button class="filter is-on" data-kind="cause" data-val="all">全部</button>
          <button class="filter" data-kind="cause" data-val="quake">地震</button>
          <button class="filter" data-kind="cause" data-val="typhoon">颱風</button>
          <button class="filter" data-kind="cause" data-val="rain">降雨</button>
          <button class="filter" data-kind="cause" data-val="slide">崩塌</button>
        </div>
      </div>
      <button class="reset" id="resetBtn" hidden>清除篩選</button>
    </div>

    <div class="lakes" id="lakeList"></div>
    <div class="empty" id="listEmpty" hidden>
      <b>沒有符合條件的紀錄</b>
      放寬篩選條件，或清除年份選取。
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <span>堰塞湖快速評估系統 · OSSInt 2026</span>
    <span>清冊：農業部農村發展及水土保持署 · 座標由 TWD97 TM2 轉 WGS84</span>
  </div>
</footer>

<script src="data/lakes.js"></script>
<script src="app.js"></script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossint-pipeline"
version = "0.1.0"
description = "堰塞湖快速評估管線 · OSSInt 2026"
requires-python = ">=3.10"
dependencies = [
    "pyproj>=3.6",   # TWD97 TM2 → WGS84 座標轉換
    "pyyaml>=6.0",   # 句型庫
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 影像處理階段再解開：
# imagery = ["numpy", "rasterio", "shapely", "geopandas"]

[project.scripts]
ossint-inventory = "pipeline.ingest.inventory:cli"
ossint-annotate = "pipeline.attribution.annotate:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.attribution" = ["templates.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

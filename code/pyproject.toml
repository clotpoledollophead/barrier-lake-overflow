[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossint-pipeline"
version = "0.1.0"
description = "堰塞湖快速評估管線 · OSSInt 2026"
requires-python = ">=3.10"
dependencies = [
    "pyproj>=3.6",       # TWD97 TM2 → WGS84 座標轉換
    "pyyaml>=6.0",       # 句型庫
    "requests>=2.31",    # CWA 即時雨量介接
    "numpy>=1.26",       # preprocess/detect/assess 共用
    "scipy>=1.11",       # ndimage：型態學運算、去斑
    "rasterio>=1.3",     # DEM 與影像讀寫
    "scikit-image>=0.22",# Otsu 門檻、connected components
    "apscheduler>=3.10", # 觸發層常駐輪詢（trigger.service --poll）；沒裝時自動退回陽春迴圈
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 向量圖資（assess.exposure 的向量版道路交集）再解開：
vector = ["shapely>=2.0", "geopandas>=0.14"]

[project.scripts]
ossint-inventory = "pipeline.ingest.inventory:cli"
ossint-annotate = "pipeline.attribution.annotate:main"
ossint-risk-live = "pipeline.ingest.risk_live:cli"
ossint-trigger = "pipeline.trigger.service:cli"
ossint-quake = "pipeline.trigger.earthquake:cli"
ossint-dispatch = "pipeline.trigger.dispatch:cli"
ossint-mask = "pipeline.preprocess.mask:cli"
ossint-sar = "pipeline.preprocess.sar:cli"
ossint-water = "pipeline.detect.water:cli"
ossint-landslide = "pipeline.detect.landslide:cli"
ossint-hypsometry = "pipeline.assess.hypsometry:cli"
ossint-inundation = "pipeline.assess.inundation:cli"
ossint-exposure = "pipeline.assess.exposure:cli"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.attribution" = ["templates.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
